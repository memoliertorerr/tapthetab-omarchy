name: vm

# Boots Omarchy's current stable VM image, installs the plugin from this
# checkout with `omarchy plugin add`, and runs ci/scenarios/*.sh against the
# live desktop. Modelled on Omarchy's own .github/workflows/test.yml (MIT).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SITE: https://nightly.omarchy.org
    steps:
      # The whole history: `omarchy plugin add` clones this checkout inside
      # the VM, and a full repository clones without shallow-clone surprises.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/tapthetab-omarchy
          fetch-depth: 0
          persist-credentials: false

      - name: Install the fetch tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends aria2 jq

      # Into RAM, as Omarchy does: faster than the runner's disk or the cache.
      - name: Fetch the VM image
        run: |
          mkdir -p /dev/shm/image && cd /dev/shm/image
          curl -fsS --retry 3 -o latest.json "$SITE/stable/latest.json"
          jq -r '"Image: Omarchy \(.omarchy_version), kernel \(.kernel)"' latest.json | tee -a "$GITHUB_STEP_SUMMARY"
          unpacked=$(jq -r .vm.unpacked latest.json)
          for file in vmlinuz initrd cmdline; do
            curl -fsS --retry 3 -o "$file" "$unpacked$file"
          done
          url=$(jq -r .vm.url latest.json)
          started=$SECONDS
          aria2c --quiet -x 16 -s 16 -o base.qcow2 "$url"
          echo "Fetched $(stat -c %s base.qcow2) bytes in $(( SECONDS - started )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$(jq -r .vm.sha256 latest.json)  base.qcow2" | sha256sum -c -

      # QEMU runs in an Arch container on the runner's KVM, as in Omarchy's CI.
      # socat is for QMP, which scenarios use to press real keys.
      - name: Run the scenarios in the VM
        run: |
          sudo chmod 0666 /dev/kvm
          docker run --rm --device /dev/kvm -v "$PWD:/w" -v /dev/shm/image:/image:ro -w /w -e VM_STATE_DIR=/tmp -e MEM=6G \
            ghcr.io/archlinux/archlinux:latest bash -euo pipefail -c '
              # pacman 7 fails every sync on a kernel without Landlock, which
              # these runners have; Omarchy and omarchy-iso do the same.
              if ! grep -qw landlock /sys/kernel/security/lsm 2>/dev/null; then
                printf "#!/bin/sh\nexec /usr/bin/pacman --disable-sandbox \"\$@\"\n" >/usr/local/bin/pacman
                chmod 0755 /usr/local/bin/pacman
              fi
              # The Omarchy Arch mirror first, the public ones after it; a
              # mirror that drops one file must not fail the run: try again.
              sed -i "1i Server = https://mirror.omarchy.org/\$repo/os/\$arch" /etc/pacman.d/mirrorlist
              for attempt in 1 2 3; do
                if pacman -Syu --noconfirm --needed qemu-system-x86 qemu-hw-display-virtio-gpu qemu-hw-display-virtio-vga qemu-img openssh socat >/dev/null; then
                  break
                elif (( attempt < 3 )); then
                  echo "pacman failed, attempt $attempt of 3; trying again in 15 s"
                  sleep 15
                else
                  echo "::error::the test container could not install QEMU"
                  exit 1
                fi
              done
              qemu-system-x86_64 --version | head -n 1
              src/tapthetab-omarchy/ci/run-scenarios /image src/tapthetab-omarchy out
            '

      # The container ran as root: its output belongs to root until here.
      - name: Hand the results to the runner's user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          if [[ -f out/summary.md ]]; then
            cat out/summary.md >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vm-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
